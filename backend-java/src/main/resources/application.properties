spring.application.name=cti-insights
server.port=8080

# Banco (Azure PostgreSQL). Usuário e senha vêm de variáveis de ambiente.
# "postgres" é o nome de banco padrão do Azure; troque se você criou outro.
spring.datasource.url=${DB_URL:jdbc:postgresql://servidor-2.postgres.database.azure.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# update cria/ajusta as tabelas sozinho (ok em desenvolvimento).
# Para a entrega final, considere trocar por validate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: chave em Base64 gerada no PowerShell (veja a aula) e validade do token
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.expiracao-minutos=120

# Origens do frontend liberadas no CORS (separe por vírgula)
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}